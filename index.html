    <!-- Apply the saved theme before first paint so there is no flash of unstyled colour. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kudii.theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#17150f' : '#faf8f4');
        } catch (e) {}
      })();
    </script>
